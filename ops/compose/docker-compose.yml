# Production on a VM: app + Postgres 18 + Caddy (TLS).
# Mirrors railway.toml: migrate replays preDeployCommand, app replays startCommand.
# Usage: see docs/DEPLOY-DOCKER.md and ops/compose/deploy.sh

name: tideline

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tideline
      POSTGRES_USER: tideline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    volumes:
      # in the postgres:18 image the volume is /var/lib/postgresql (PGDATA=…/18/docker);
      # mounting …/data would leave the data in an anonymous volume
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tideline -d tideline"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s

  # One-shot step before start: pre-deploy backup -> migrations -> (optional) seed.
  # A strict && chain, as on Railway: no backup, no migrations.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: tideline-app
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tideline:${POSTGRES_PASSWORD}@db:5432/tideline
    volumes:
      - /var/backups/tideline:/backups
    command: >
      sh -c 'if [ "$$SKIP_PREDEPLOY_BACKUP" = "1" ]; then echo skip backup;
      else BACKUP_LABEL=pre-migration-$$(python -m alembic heads --resolve-dependencies 2>/dev/null | head -c 12 || echo unknown) python /srv/ops/backup.py; fi
      && python -m alembic upgrade head
      && if [ "$$SEED_DEMO" = "1" ]; then echo seeding demo data && python -m app.seed; fi'

  app:
    image: tideline-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: postgresql://tideline:${POSTGRES_PASSWORD}@db:5432/tideline
      PORT: "8000"
    volumes:
      # local backups (BACKUP_DIR=/backups); cron runs docker compose run app
      - /var/backups/tideline:/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set it in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
